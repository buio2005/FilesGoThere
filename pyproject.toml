[project]
name = "filesgothere"
# Il numero di versione sta in un posto solo: src/filesgothere/__init__.py.
# Qui viene letto da lì, così non può andare fuori sincrono.
dynamic = ["version"]
description = "Local-first automatic file organizer for Windows"
requires-python = ">=3.12"
dependencies = [
  "watchdog>=4.0.0",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.7.0",
]

[project.scripts]
filesgothere = "filesgothere.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "filesgothere.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
