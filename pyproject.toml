[project]
name = "filesgothere"
version = "0.1.0"
description = "Local-first automatic file organizer for Windows"
requires-python = ">=3.12"
dependencies = [
  "watchdog>=4.0.0",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.7.0",
]

[project.scripts]
filesgothere = "filesgothere.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
